<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1280px; height: 670px; }
  .pad { padding: 74px 92px 70px; }

  h1 {
    font-size: 68px;
    font-weight: normal;
    line-height: 1.44;
    letter-spacing: 0.015em;
  }
  h1 .lead { color: #a9aeb7; font-size: 46px; letter-spacing: 0.04em; display: block; margin-bottom: 22px; }
  h1 .big { font-size: 96px; color: #b99a63; letter-spacing: 0.01em; }

  .footrow { display: flex; align-items: flex-end; justify-content: space-between; }
  .rule { margin-bottom: 26px; }
</style>
</head>
<body>
<div class="canvas"><div class="pad">

  <div class="eyebrow">AIと働く記録<span class="num">02</span></div>

  <div class="spacer"></div>

  <h1>
    <span class="lead">AIで自動化したら、</span>
    自分の仕事が<br>
    <span class="big">2分</span>しか残らなかった。
  </h1>

  <div class="spacer"></div>
  <div class="rule"></div>

  <div class="footrow">
    <div class="foot">
      100件の出荷　30〜50分 → 約2分<br>
      でも、本当に作ったのは自動化じゃなかった。
    </div>
  </div>

</div></div>
</body>
</html>
