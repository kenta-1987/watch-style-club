<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1280px; height: 720px; }
  .pad { padding: 78px 100px 74px; }

  .mark {
    font-size: 130px;
    line-height: 0.7;
    color: rgba(185, 154, 99, 0.34);
    margin-bottom: 14px;
  }

  blockquote {
    font-size: 60px;
    font-weight: normal;
    line-height: 1.66;
    letter-spacing: 0.02em;
  }
  blockquote .hi { color: #b99a63; }

  .rule { margin-bottom: 24px; }
</style>
</head>
<body>
<div class="canvas"><div class="pad">

  <div class="eyebrow">AIと働く記録<span class="num">02</span></div>

  <div class="spacer"></div>

  <div class="mark">“</div>
  <blockquote>
    毎日やり直していた<br>
    十数個の判断を、<br>
    <span class="hi">一度だけやって、固定した。</span>
  </blockquote>

  <div class="spacer"></div>
  <div class="rule"></div>
  <div class="foot">速さは、AIの性能から出てきたんじゃない。</div>

</div></div>
</body>
</html>
